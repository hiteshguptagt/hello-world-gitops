apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: hello-world
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/hiteshguptagt/hello-world-gitops.git
    targetRevision: HEAD
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: hello

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
